<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhazul Islam Ayon | Founder &amp; CEO, Sharp Shark Infosys</title>
<meta name="description" content="Minhazul Islam Ayon, Founder &amp; CEO of Sharp Shark Infosys. Entrepreneur and business development and operations leader from Bangladesh.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:rgba(255,255,255,.05);--line:rgba(212,175,55,.25);--gold:#d4af37;--gold2:#f1d77a;--txt:#ece8dd;--mut:#a39f92;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--bg)}
body{margin:0;background:transparent;color:var(--txt);font:300 16px/1.7 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0;line-height:1.2}
a{color:inherit;text-decoration:none}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:18px;align-items:center;padding:14px 5vw;background:rgba(10,10,10,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
nav b{color:var(--gold);font-family:'Playfair Display',serif;margin-right:auto;letter-spacing:.08em}
nav a{font-size:13px;color:var(--mut)}nav a:hover{color:var(--gold2)}
section{padding:90px 5vw;max-width:1100px;margin:auto}
.eyebrow{color:var(--gold);letter-spacing:.25em;font-size:12px;text-transform:uppercase;margin-bottom:10px}
h2{font-size:clamp(28px,4vw,40px);margin-bottom:28px}
h2::after{content:"";display:block;width:60px;height:2px;background:var(--gold);margin-top:14px}
.hero{min-height:88vh;display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(36px,6vw,64px);background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{letter-spacing:.2em;margin:14px 0 4px;font-weight:500}
.tag{color:var(--mut);margin:0 0 22px}
.head{font-family:'Playfair Display',serif;font-size:clamp(20px,2.6vw,28px);margin:18px 0}
.photo{aspect-ratio:4/5;border-radius:18px;border:1px solid var(--line);background:linear-gradient(160deg,#1a1a1a,#0d0d0d);display:grid;place-items:center;text-align:center;color:var(--mut);font-size:13px;padding:20px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{padding:11px 20px;border-radius:999px;border:1px solid var(--gold);font-size:14px;cursor:pointer;background:transparent;color:var(--gold2);font-family:inherit}
.btn.fill{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#111;font-weight:500}
.btn:hover{filter:brightness(1.15)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;backdrop-filter:blur(10px)}
.card h3{font-size:19px;color:var(--gold2)}.card p{margin:6px 0 0;color:var(--mut);font-size:14px}
.logo{width:44px;height:44px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--gold);font-size:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:14px}
.fade{opacity:0;transform:translateY(24px);transition:.8s}.fade.in{opacity:1;transform:none}
.ph{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--mut);font-size:13px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
html{background:radial-gradient(1000px 600px at 85% -5%,rgba(212,175,55,.16),transparent),radial-gradient(800px 500px at 0% 100%,rgba(212,175,55,.08),transparent),#070707}
.card{transition:transform .25s ease,border-color .3s,box-shadow .3s;will-change:transform;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:0 10px 40px rgba(0,0,0,.35)}
.card:hover{border-color:var(--gold);box-shadow:0 14px 50px rgba(212,175,55,.18)}
.photo{box-shadow:0 0 0 6px rgba(212,175,55,.08),0 30px 80px rgba(212,175,55,.22)}
.chip{backdrop-filter:blur(8px);transition:.25s}.chip:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-2px)}
nav{border-radius:0 0 18px 18px}
footer{border-top:1px solid var(--line);text-align:center;padding:40px 5vw;color:var(--mut);font-size:13px}
footer b{display:block;color:var(--gold);letter-spacing:.12em;margin-bottom:6px}
@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto;padding-top:50px}.photo{max-width:320px}section{padding:64px 5vw}}
@media(prefers-reduced-motion:reduce){.fade{transition:none;opacity:1;transform:none}html{scroll-behavior:auto}}

/* ===== MIDNIGHT EXECUTIVE THEME (visual only) ===== */
html[data-theme="midnight"]{--bg:#050816;--card:rgba(16,22,44,.55);--line:rgba(120,190,255,.22);--gold:#38bdf8;--gold2:#bfe9ff;--txt:#e8eefc;--mut:#9aa6c2;--violet:#8b5cf6;--silver:#cfd8ea;scrollbar-color:#2b3b6b #050816;
background:linear-gradient(180deg,#050816 0%,#070c20 45%,#04060f 100%)}
html[data-theme="midnight"] ::selection{background:rgba(56,189,248,.35);color:#fff}
@keyframes mdrift{0%{transform:translate3d(-3%,-2%,0) rotate(0deg) scale(1)}50%{transform:translate3d(3%,2%,0) rotate(4deg) scale(1.08)}100%{transform:translate3d(-2%,3%,0) rotate(-3deg) scale(1.04)}}
html[data-theme="midnight"] body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;will-change:transform;animation:mdrift 30s ease-in-out infinite alternate;
background:radial-gradient(900px 620px at 18% 14%,rgba(37,99,235,.38),transparent 62%),radial-gradient(820px 620px at 86% 26%,rgba(124,58,237,.30),transparent 62%),radial-gradient(940px 700px at 58% 96%,rgba(6,182,212,.22),transparent 62%)}
html[data-theme="midnight"] body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.58) 100%)}
/* nav */
html[data-theme="midnight"] nav{background:linear-gradient(180deg,rgba(8,12,30,.78),rgba(8,12,30,.52));border-bottom:1px solid rgba(120,190,255,.22);box-shadow:0 12px 40px rgba(0,0,0,.5),0 1px 0 rgba(56,189,248,.28);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%)}
html[data-theme="midnight"] nav b{background:linear-gradient(90deg,#fff,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="midnight"] nav a{transition:color .25s,text-shadow .25s}
html[data-theme="midnight"] nav a:hover{color:#e0f4ff;text-shadow:0 0 14px rgba(56,189,248,.8)}
/* type */
html[data-theme="midnight"] .hero h1{background:linear-gradient(90deg,#ffffff 0%,#b8e4ff 38%,#7dd3fc 62%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 28px rgba(56,189,248,.28))}
html[data-theme="midnight"] .role{color:var(--silver)}
html[data-theme="midnight"] .head{background:linear-gradient(90deg,#ffffff,#bfe9ff 55%,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-theme="midnight"] .eyebrow{color:#7dd3fc;text-shadow:0 0 16px rgba(56,189,248,.55)}
html[data-theme="midnight"] h2::after{height:2px;width:72px;background:linear-gradient(90deg,#22d3ee,#8b5cf6);box-shadow:0 0 14px rgba(56,189,248,.8)}
/* glass panels with neon edge + reflection */
html[data-theme="midnight"] .card{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.025) 45%,rgba(120,100,255,.05) 100%),rgba(10,15,34,.55);border:1px solid rgba(160,210,255,.16);border-radius:18px;backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 22px 60px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 40px rgba(56,189,248,.04);transition:transform .3s ease,box-shadow .35s,border-color .35s}
html[data-theme="midnight"] .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.5;transition:opacity .35s;background:linear-gradient(135deg,rgba(56,189,248,.95),rgba(56,189,248,0) 38%,rgba(139,92,246,0) 62%,rgba(139,92,246,.9));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
html[data-theme="midnight"] .card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.11) 46%,transparent 60%);background-size:260% 100%;background-position:130% 0;transition:background-position .9s ease}
html[data-theme="midnight"] .card:hover{border-color:rgba(125,211,252,.4);box-shadow:0 28px 80px rgba(0,0,0,.6),0 0 46px rgba(56,189,248,.20),0 0 90px rgba(139,92,246,.12),inset 0 1px 0 rgba(255,255,255,.2)}
html[data-theme="midnight"] .card:hover::before{opacity:1}
html[data-theme="midnight"] .card:hover::after{background-position:-30% 0}
html[data-theme="midnight"] .card h3{color:#d7f0ff}
html[data-theme="midnight"] .logo{border:1px solid rgba(160,210,255,.25);background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.02));color:#7dd3fc;box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 6px 18px rgba(0,0,0,.4)}
/* chips */
html[data-theme="midnight"] .chip{background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(160,210,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 22px rgba(0,0,0,.35);transition:transform .25s,border-color .25s,box-shadow .25s,color .25s}
html[data-theme="midnight"] .chip:hover{color:#fff;border-color:rgba(125,211,252,.7);box-shadow:0 0 22px rgba(56,189,248,.35),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(-3px)}
/* buttons */
html[data-theme="midnight"] .btn{border:1px solid rgba(125,211,252,.55);color:#d7f0ff;background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .25s,box-shadow .25s,filter .25s,border-color .25s}
html[data-theme="midnight"] .btn:hover{transform:translateY(-2px);box-shadow:0 0 26px rgba(56,189,248,.45);border-color:#7dd3fc;filter:none}
html[data-theme="midnight"] .btn.fill{background:linear-gradient(100deg,#22d3ee 0%,#60a5fa 50%,#a78bfa 100%);color:#041225;border-color:transparent;font-weight:500;box-shadow:0 8px 28px rgba(56,189,248,.35),inset 0 1px 0 rgba(255,255,255,.45)}
html[data-theme="midnight"] .btn.fill:hover{box-shadow:0 12px 38px rgba(96,165,250,.55),0 0 34px rgba(167,139,250,.4),inset 0 1px 0 rgba(255,255,255,.5)}
/* portrait: 3D glass frame */
html[data-theme="midnight"] .photo{position:relative;border:1px solid rgba(160,210,255,.32);border-radius:24px;background:linear-gradient(160deg,#0d1530,#060a1a);box-shadow:0 0 0 6px rgba(56,189,248,.06),0 36px 90px rgba(0,0,0,.6),0 0 90px rgba(56,189,248,.26),0 0 140px rgba(139,92,246,.22),inset 0 0 0 1px rgba(255,255,255,.08)}
html[data-theme="midnight"] .photo::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.16) 0%,transparent 34%,transparent 68%,rgba(139,92,246,.22) 100%);mix-blend-mode:screen}
/* hero ambient light behind portrait */
@keyframes mpulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.95;transform:scale(1.12)}}
html[data-theme="midnight"] .hero{position:relative}
html[data-theme="midnight"] .hero::before{content:"";position:absolute;right:-6%;top:50%;width:min(560px,70vw);height:min(560px,70vw);margin-top:calc(min(560px,70vw)/-2);border-radius:50%;pointer-events:none;z-index:-1;background:radial-gradient(circle,rgba(56,189,248,.28),rgba(139,92,246,.18) 45%,transparent 70%);animation:mpulse 7s ease-in-out infinite}
/* 3D section reveal */
html[data-theme="midnight"] .fade{opacity:0;transform:translateY(38px) perspective(1100px) rotateX(6deg);transform-origin:50% 100%;transition:opacity .9s ease,transform .95s cubic-bezier(.2,.7,.2,1)}
html[data-theme="midnight"] .fade.in{opacity:1;transform:none}
html[data-theme="midnight"] footer{border-top:1px solid transparent;border-image:linear-gradient(90deg,transparent,rgba(56,189,248,.55),rgba(139,92,246,.55),transparent) 1;background:linear-gradient(180deg,transparent,rgba(5,8,22,.6))}
html[data-theme="midnight"] footer b{background:linear-gradient(90deg,#fff,#7dd3fc,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
/* theme switch button */
#tt{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 16px;border-radius:999px;border:1px solid var(--gold);background:rgba(8,12,28,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--gold2);font:500 13px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 26px rgba(0,0,0,.45);transition:box-shadow .25s,transform .25s}
#tt:hover{box-shadow:0 0 24px rgba(56,189,248,.4);transform:translateY(-2px)}
@media(max-width:760px){html[data-theme="midnight"] .card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}html[data-theme="midnight"] .card::after{display:none}html[data-theme="midnight"] .hero::before{right:-30%}}
@media(prefers-reduced-motion:reduce){html[data-theme="midnight"] body::before,html[data-theme="midnight"] .hero::before{animation:none}html[data-theme="midnight"] .fade{transition:none;opacity:1;transform:none}html[data-theme="midnight"] .card,html[data-theme="midnight"] .btn,html[data-theme="midnight"] .chip{transition:none}}
</style>
</head>

[[-6,2.5,-12,0x2563eb,16],[7,-3,-12,0x7c3aed,15],[0,4.5,-14,0x06b6d4,14]].forEach(c=>{const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:dot,color:c[3],transparent:true,opacity:.26,blending:THREE.AdditiveBlending,depthWrite:false}));sp.position.set(c[0],c[1],c[2]);sp.scale.set(c[4],c[4],1);sp.userData.x=c[0];g.add(sp);glows.push(sp)});
/* particles: two soft additive layers */
function layer(n,col){const p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*34;p[i*3+1]=(Math.random()-.5)*22;p[i*3+2]=-14+Math.random()*18}
const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(p,3));
const pt=new THREE.Points(geo,new THREE.PointsMaterial({map:dot,color:col,size:.13,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));S.add(pt);return pt}
const pA=layer(mob?320:900,0x7dd3fc),pB=layer(mob?180:520,0xa78bfa);
const TH={midnight:{metal:0xdfe6f5,wire:[0x38bdf8,0x8b5cf6],l:[0x38bdf8,0x8b5cf6],p:[0x7dd3fc,0xa78bfa],gl:[0x2563eb,0x7c3aed,0x06b6d4]},
gold:{metal:0xe8c766,wire:[0xd4af37,0xf1d77a],l:[0xf1d77a,0xd4af37],p:[0xf1d77a,0xd4af37],gl:[0xd4af37,0xb8860b,0xf1d77a]}};
window.__setThree=function(n){const t=TH[n]||TH.midnight;metal.forEach(m=>m.color.setHex(t.metal));wire.forEach((m,i)=>m.color.setHex(t.wire[i%2]));L1.color.setHex(t.l[0]);L2.color.setHex(t.l[1]);pA.material.color.setHex(t.p[0]);pB.material.color.setHex(t.p[1]);glows.forEach((s,i)=>s.material.color.setHex(t.gl[i]))};

addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
addEventListener("scroll",()=>{sy=scrollY/Math.max(1,document.body.scrollHeight-innerHeight)});

mxs+=(mx-mxs)*.05;mys+=(my-mys)*.05;
items.forEach(o=>{const m=o.m;m.position.x=o.x*sx+Math.sin(t*.3+o.p)*.25;m.position.y=o.y+Math.sin(t*.5+o.p)*o.f;m.rotation.x+=o.r[0]*dt*10;m.rotation.y+=o.r[1]*dt*10;m.rotation.z+=o.r[2]*dt*10});

pA.rotation.y=t*.012+sy*1.2;pB.rotation.y=-t*.01-sy*.9;pA.rotation.x=mys*.1;pB.rotation.x=-mys*.1;
g.position.y=sy*3;g.rotation.y=mxs*.28+sy*.5;g.rotation.x=mys*.12;
K.position.x=mxs*1.2;K.position.y=-mys*.8;K.position.z=8-sy*1.2;K.lookAt(0,0,0);
R.render(S,K);if(!still)requestAnimationFrame(f)}
addEventListener("resize",rs);rs();
if(!still)requestAnimationFrame(f);
}catch(x){}})();
